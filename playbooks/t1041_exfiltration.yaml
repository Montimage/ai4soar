id: pb-t1041-block-exfiltration
name: "Block Data Exfiltration over C2 Channel"
version: "1.0"
techniques:
  - T1041
  - T1048
  - T1048.003
  - T1020
tactics:
  - exfiltration
description: "Block outbound exfiltration traffic, terminate the responsible process, preserve transfer logs for forensics"

parameters:
  src_ip:
    type: ipv4
    required: true
    sources:
      - _source.data.srcip
      - data.srcip
      - srcip
    description: "Internal host exfiltrating data"
  dst_ip:
    type: ipv4
    required: false
    sources:
      - _source.data.dstip
      - data.dstip
      - dstip
    description: "External destination receiving the exfiltrated data"
  hostname:
    type: string
    required: false
    sources:
      - _source.agent.name
      - agent.name
      - hostname
    description: "Hostname of the exfiltrating host"
  username:
    type: string
    required: false
    sources:
      - _source.data.srcuser
      - data.srcuser
    description: "User context performing the transfer"
  incident_api_url:
    type: url
    required: false
    env: INCIDENT_API_URL
    description: "Base URL of the incident / ticketing API (deployment setting, from .env)"

cacao:
  type: playbook
  spec_version: cacao-2.0
  id: "playbook--b9e3c7d6-0f4a-4b8c-3d6e-7a1b5c9d2e4f"
  name: "Block Exfiltration from {{src_ip}} to {{dst_ip}}"
  description: "Block outbound data transfer from {{src_ip}} to {{dst_ip}}, collect transfer evidence, open incident"
  playbook_types:
    - prevention
    - remediation
    - investigation
    - notification
  agent_definitions:
    linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50:
      type: linux
      name: "AI4SOAR / Shuffle"
      description: "Runs the steps; each one acts over SSH on its target machine"
      address:
        ipv4:
          - "127.0.0.1"
    http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b:
      type: http-api
      name: "Incident / ticketing API"
      address:
        url:
          - "{{incident_api_url}}"
  target_definitions:
    ssh--a12cb621-1609-58f5-b6fd-17f773136ba5:
      type: ssh
      name: "Affected host {{hostname}}"
      description: "The machine the steps act on (the victim). In Shuffle, fill User name and Private key file id (or Password) of an account with root rights on it."
      address:
        dname:
          - "{{hostname}}"
  workflow_start: "step--start"
  workflow:

    # CACAO 2.0 requires every playbook to contain a start step, and
    # workflow_start MUST reference it (see data/cacao-schemas/playbook.json).
    step--start:
      type: start
      on_completion: "step--block-transfer"

    step--block-transfer:
      type: action
      name: "Block outbound exfiltration traffic from {{src_ip}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--a12cb621-1609-58f5-b6fd-17f773136ba5"]
      commands:
        - type: bash
          # On the exfiltrating host: drop everything it sends to the destination
          command: >
            iptables -I OUTPUT -d {{dst_ip}} -j DROP
            && echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] BLOCKED exfil {{src_ip}} -> {{dst_ip}}" >> /var/log/ai4soar_blocks.log
      on_success: "step--collect-evidence"
      on_failure: "step--collect-evidence"

    step--collect-evidence:
      type: action
      name: "Collect network transfer evidence from {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--a12cb621-1609-58f5-b6fd-17f773136ba5"]
      commands:
        - type: bash
          command: >
            netstat -antp 2>/dev/null > /tmp/ai4soar_exfil_net_{{hostname}}.txt;
             ss -antp 2>/dev/null >> /tmp/ai4soar_exfil_net_{{hostname}}.txt
        - type: bash
          command: >
            lsof -i 2>/dev/null | grep ESTABLISHED >> /tmp/ai4soar_exfil_net_{{hostname}}.txt || true
      on_success: "step--terminate-process"
      on_failure: "step--terminate-process"

    step--terminate-process:
      type: action
      # Close the sockets to the exfiltration destination instead of killing tools by
      # name: a pattern like "nc" would also kill rsync, systemd-timesyncd, ...
      name: "Close connections from {{hostname}} to {{dst_ip}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--a12cb621-1609-58f5-b6fd-17f773136ba5"]
      commands:
        - type: bash
          command: >
            ss -tnp dst {{dst_ip}} > /tmp/ai4soar_exfil_procs_{{hostname}}.txt; ss -K dst {{dst_ip}}
      on_success: "step--lock-user"
      on_failure: "step--lock-user"

    step--lock-user:
      type: action
      name: "Lock user account {{username}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--a12cb621-1609-58f5-b6fd-17f773136ba5"]
      commands:
        - type: bash
          command: >
            usermod -L -e 1 {{username}}
      on_completion: "step--create-ticket"

    step--create-ticket:
      type: action
      name: "Create exfiltration incident ticket"
      agent: "http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b"
      commands:
        - type: http-api
          command: "POST /api/v1/incidents HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: >
            {
              "title":     "Data Exfiltration from {{hostname}} ({{src_ip}}) to {{dst_ip}}",
              "severity":  "critical",
              "technique": "T1041",
              "hostname":  "{{hostname}}",
              "src_ip":    "{{src_ip}}",
              "dst_ip":    "{{dst_ip}}",
              "username":  "{{username}}"
            }
      on_completion: "step--end"

    step--end:
      type: end
