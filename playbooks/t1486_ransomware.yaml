id: pb-t1486-contain-ransomware
name: "Contain Ransomware Encryption"
version: "1.0"
techniques:
  - T1486
  - T1490
tactics:
  - impact
description: "Immediately isolate the infected host, kill encryption processes, snapshot affected volumes, and open a P1 incident"

parameters:
  hostname:
    type: string
    required: true
    sources:
      - _source.agent.name
      - agent.name
      - hostname
    description: "Infected host to isolate"
  src_ip:
    type: ipv4
    required: false
    sources:
      - _source.data.srcip
      - data.srcip
      - srcip
    description: "IP of the infected host"
  username:
    type: string
    required: false
    sources:
      - _source.data.srcuser
      - data.srcuser
    description: "User context running the encryption process"
  incident_api_url:
    type: url
    required: false
    env: INCIDENT_API_URL
    description: "Base URL of the incident / ticketing API (deployment setting, from .env)"

cacao:
  type: playbook
  spec_version: cacao-2.0
  id: "playbook--b3e7c1a2-4f8d-4e2b-9c0a-1d5f7e3b8a6c"
  name: "Contain Ransomware on {{hostname}}"
  description: "Isolate {{hostname}} from the network, kill known encryption processes, and initiate recovery"
  playbook_types:
    - remediation
    - prevention
    - notification
  agent_definitions:
    linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50:
      type: linux
      name: "AI4SOAR / Shuffle"
      description: "Runs the steps; each one acts over SSH on its target machine"
      address:
        ipv4:
          - "127.0.0.1"
    http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b:
      type: http-api
      name: "Incident / ticketing API"
      address:
        url:
          - "{{incident_api_url}}"
  target_definitions:
    ssh--b6392c7d-08ec-56d5-8b51-110b178103a3:
      type: ssh
      name: "Affected host {{hostname}}"
      description: "The machine the steps act on (the victim). In Shuffle, fill User name and Private key file id (or Password) of an account with root rights on it."
      address:
        dname:
          - "{{hostname}}"
  workflow_start: "step--start"
  workflow:

    # CACAO 2.0 requires every playbook to contain a start step, and
    # workflow_start MUST reference it (see data/cacao-schemas/playbook.json).
    step--start:
      type: start
      on_completion: "step--isolate-host"

    step--isolate-host:
      type: action
      name: "Network-isolate {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--b6392c7d-08ec-56d5-8b51-110b178103a3"]
      commands:
        - type: bash
          # All traffic in and out is dropped, open connections included (C2, exfiltration),
          # except SSH (port 22) so the responders keep access, and loopback. ACCEPT rules
      # go first.
          command: |
            iptables -I INPUT 1 -i lo -j ACCEPT
            iptables -I OUTPUT 1 -o lo -j ACCEPT
            iptables -I INPUT 2 -p tcp --dport 22 -j ACCEPT
            iptables -I OUTPUT 2 -p tcp --sport 22 -j ACCEPT
            iptables -I INPUT 3 -j DROP
            iptables -I OUTPUT 3 -j DROP
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] ISOLATED {{hostname}} ({{src_ip}}), SSH only" | tee -a /var/log/ai4soar_blocks.log
      on_success: "step--snapshot-volumes"
      on_failure: "step--snapshot-volumes"

    step--kill-processes:
      type: action
      # The encryptor runs as the compromised account: ending that account's processes
      # stops it. Regular accounts only (uid >= 1000): killing every process of root or
      # a service account would take the host down. Otherwise the files it is writing
      # point to the process.
      name: "Stop the encryption: kill the processes of {{username}} on {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--b6392c7d-08ec-56d5-8b51-110b178103a3"]
      commands:
        - type: bash
          command: |
            [ "$(id -u {{username}} 2>/dev/null || echo 0)" -ge 1000 ] && pkill -KILL -u {{username}} && echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] KILLED processes of {{username}} on {{hostname}}" | tee -a /var/log/ai4soar_blocks.log || echo "No regular account to stop: find the encrypting process with: lsof +D /home"
      on_success: "step--create-ticket"
      on_failure: "step--create-ticket"

    step--snapshot-volumes:
      type: action
      # Before the kill: which files were changed in the last hour (encrypted files,
      # ransom notes) and the process tree with the encryptor, kept for the investigation
      name: "Preserve evidence of the encryption on {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--b6392c7d-08ec-56d5-8b51-110b178103a3"]
      commands:
        - type: bash
          command: |
            find /home /srv /var/www /opt -xdev -type f -mmin -60 -ls 2>/dev/null | head -2000 > /root/ai4soar_ransomware_files.txt
            ps auxf > /root/ai4soar_ransomware_procs.txt
      on_completion: "step--kill-processes"

    step--create-ticket:
      type: action
      name: "Open P1 ransomware incident"
      agent: "http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b"
      commands:
        - type: http-api
          command: "POST /api/v1/incidents HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: >
            {
              "title":     "RANSOMWARE detected on {{hostname}}",
              "severity":  "critical",
              "technique": "T1486",
              "hostname":  "{{hostname}}",
              "src_ip":    "{{src_ip}}",
              "username":  "{{username}}",
              "priority":  "P1"
            }
      on_completion: "step--end"

    step--end:
      type: end
