id: pb-t1098-respond-account-manipulation
name: "Respond to Account Manipulation"
version: "1.0"
techniques:
  - T1098
  - T1098.001
  - T1136
  - T1136.001
  - T1136.002
tactics:
  - persistence
description: "Revert unauthorized account changes, remove rogue accounts or SSH keys, audit group membership, and alert the SOC"

parameters:
  hostname:
    type: string
    required: true
    sources:
      - _source.agent.name
      - agent.name
      - hostname
    description: "Host where account manipulation occurred"
  username:
    type: string
    required: true
    sources:
      - _source.data.dstuser
      - data.dstuser
      - _source.data.srcuser
      - data.srcuser
    description: "Account that was manipulated or created"
  src_ip:
    type: ipv4
    required: false
    sources:
      - _source.data.srcip
      - data.srcip
    description: "IP of the actor performing the manipulation"
  incident_api_url:
    type: url
    required: false
    env: INCIDENT_API_URL
    description: "Base URL of the incident / ticketing API (deployment setting, from .env)"

cacao:
  type: playbook
  spec_version: cacao-2.0
  id: "playbook--f7c1a5b4-8d2e-4f6a-1b4c-5e9d3f7a0b2c"
  name: "Respond to Account Manipulation of {{username}} on {{hostname}}"
  description: "Lock {{username}}, audit sudo/admin group membership, purge unauthorized SSH keys on {{hostname}}"
  playbook_types:
    - remediation
    - investigation
    - notification
  agent_definitions:
    linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50:
      type: linux
      name: "AI4SOAR / Shuffle"
      description: "Runs the steps; each one acts over SSH on its target machine"
      address:
        ipv4:
          - "127.0.0.1"
    http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b:
      type: http-api
      name: "Incident / ticketing API"
      address:
        url:
          - "{{incident_api_url}}"
  target_definitions:
    ssh--1402bddd-f7f9-53dc-8c49-cd523fd8ad0f:
      type: ssh
      name: "Affected host {{hostname}}"
      description: "The machine the steps act on (the victim). In Shuffle, fill User name and Private key file id (or Password) of an account with root rights on it."
      address:
        dname:
          - "{{hostname}}"
  workflow_start: "step--start"
  workflow:

    # CACAO 2.0 requires every playbook to contain a start step, and
    # workflow_start MUST reference it (see data/cacao-schemas/playbook.json).
    step--start:
      type: start
      on_completion: "step--lock-account"

    step--lock-account:
      type: action
      name: "Lock manipulated account {{username}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--1402bddd-f7f9-53dc-8c49-cd523fd8ad0f"]
      commands:
        - type: bash
          command: >
            usermod -L -e 1 {{username}}
            && echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] LOCKED {{username}} on {{hostname}}" | tee -a /var/log/ai4soar_blocks.log
      on_success: "step--audit-groups"
      on_failure: "step--audit-groups"

    step--audit-groups:
      type: action
      name: "Audit privileged group membership on {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--1402bddd-f7f9-53dc-8c49-cd523fd8ad0f"]
      commands:
        - type: bash
          command: >
            getent group sudo wheel admin 2>/dev/null > /tmp/ai4soar_groups_{{hostname}}.txt;
             grep -E '^[^:]*:[^:]*:0:' /etc/passwd | cut -d: -f1 >> /tmp/ai4soar_groups_{{hostname}}.txt
      on_success: "step--purge-ssh-keys"
      on_failure: "step--purge-ssh-keys"

    step--purge-ssh-keys:
      type: action
      name: "Remove all SSH keys of {{username}} (backup kept for review)"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--1402bddd-f7f9-53dc-8c49-cd523fd8ad0f"]
      commands:
        - type: bash
          # ~user is that account's home directory
          command: |
            if [ -f ~{{username}}/.ssh/authorized_keys ]; then
              install -m 600 ~{{username}}/.ssh/authorized_keys /root/ai4soar_bak_keys_{{username}}.txt
              : > ~{{username}}/.ssh/authorized_keys
              echo "SSH keys of {{username}} removed, backup in /root/ai4soar_bak_keys_{{username}}.txt"
            else
              echo "{{username}} has no SSH keys"
            fi
      on_completion: "step--create-ticket"

    step--create-ticket:
      type: action
      name: "Create account manipulation incident ticket"
      agent: "http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b"
      commands:
        - type: http-api
          command: "POST /api/v1/incidents HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: >
            {
              "title":     "Account Manipulation: {{username}} on {{hostname}}",
              "severity":  "high",
              "technique": "T1098",
              "hostname":  "{{hostname}}",
              "username":  "{{username}}",
              "src_ip":    "{{src_ip}}"
            }
      on_completion: "step--end"

    step--end:
      type: end
