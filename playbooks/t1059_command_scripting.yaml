id: pb-t1059-contain-malicious-execution
name: "Contain Malicious Script Execution"
version: "1.0"
techniques:
  - T1059
  - T1059.001
  - T1059.003
  - T1059.004
tactics:
  - execution
description: "Kill the malicious process on the affected host and collect forensic evidence"

parameters:
  hostname:
    type: string
    required: true
    sources:
      - _source.agent.name
      - agent.name
      - hostname
    description: "Host where malicious execution was detected"
  process_name:
    type: text
    required: false
    sources:
      - _source.data.win.eventdata.image
      - _source.data.process.name
      - data.process.name
    description: "Malicious process name or path"
  src_ip:
    type: ipv4
    required: false
    sources:
      - _source.data.srcip
      - data.srcip
    description: "Remote IP if execution was triggered remotely"
  username:
    type: string
    required: false
    sources:
      - _source.data.dstuser
      - _source.data.win.eventdata.subjectUserName
    description: "User account under which the process ran"
  incident_api_url:
    type: url
    required: false
    env: INCIDENT_API_URL
    description: "Base URL of the incident / ticketing API (deployment setting, from .env)"

cacao:
  type: playbook
  spec_version: cacao-2.0
  id: "playbook--3cbb6b80-3e1b-474e-9218-1d08cc84fa65"
  name: "Contain Malicious Execution on {{hostname}}"
  description: "Kill {{process_name}} on {{hostname}} and collect forensic evidence"
  playbook_types:
    - remediation
    - investigation
    - notification
  agent_definitions:
    linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50:
      type: linux
      name: "AI4SOAR / Shuffle"
      description: "Runs the steps; each one acts over SSH on its target machine"
      address:
        ipv4:
          - "127.0.0.1"
    http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b:
      type: http-api
      name: "Incident / ticketing API"
      address:
        url:
          - "{{incident_api_url}}"
  target_definitions:
    ssh--2bc38c28-b027-5a01-9cdc-e484236ecac2:
      type: ssh
      name: "Affected host {{hostname}}"
      description: "The machine the steps act on (the victim). In Shuffle, fill User name and Private key file id (or Password) of an account with root rights on it."
      address:
        dname:
          - "{{hostname}}"
  workflow_start: "step--start"
  workflow:

    # CACAO 2.0 requires every playbook to contain a start step, and
    # workflow_start MUST reference it (see data/cacao-schemas/playbook.json).
    step--start:
      type: start
      on_completion: "step--collect-evidence"

    step--kill-process:
      type: action
      name: "Kill {{process_name}} on {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--2bc38c28-b027-5a01-9cdc-e484236ecac2"]
      commands:
        - type: bash
          # A path: kill what runs that file (fuser). A name: kill the process of that
          # exact name. Not
          # "pkill -f": it also matched the shell running this step
          command: |
            case '{{process_name}}' in /*) fuser -k -KILL '{{process_name}}' ;; *) pkill -KILL -x '{{process_name}}' ;; esac && echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] KILLED {{process_name}} on {{hostname}}" | tee -a /var/log/ai4soar_blocks.log
      on_success: "step--notify"
      on_failure: "step--notify"
    step--collect-evidence:
      type: action
      name: "Collect process and connection snapshot from {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--2bc38c28-b027-5a01-9cdc-e484236ecac2"]
      commands:
        - type: bash
          # Before the kill: the process tree and its connections are the evidence
          command: |
            ps auxf > /root/ai4soar_snapshot_procs.txt
            ss -tanp > /root/ai4soar_snapshot_conns.txt
      on_completion: "step--kill-process"
    step--notify:
      type: action
      name: "Escalate to SOC"
      agent: "http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b"
      commands:
        - type: http-api
          command: "POST /api/v1/incidents HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: '{"title":"Malicious Execution on {{hostname}}","severity":"high","process":"{{process_name}}","user":"{{username}}","technique":"T1059"}'
      on_completion: "step--end"
    step--end:
      type: end
