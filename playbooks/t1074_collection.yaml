id: pb-t1074-respond-data-collection
name: "Respond to Suspicious Data Collection"
version: "1.0"
techniques:
  - T1005
  - T1074
  - T1074.001
  - T1560
  - T1113
tactics:
  - collection
description: "Contain suspicious data staging or collection activity on the affected host"

parameters:
  hostname:
    type: string
    required: true
    sources:
      - _source.agent.name
      - agent.name
    description: "Host where data collection was detected"
  src_ip:
    type: ipv4
    required: false
    sources:
      - _source.data.srcip
      - data.srcip
    description: "Source IP (if exfiltration destination known)"
  username:
    type: string
    required: false
    sources:
      - _source.data.dstuser
      - _source.data.win.eventdata.subjectUserName
    description: "User account performing the collection"
  file_path:
    type: text
    required: false
    sources:
      - _source.syscheck.path
      - _source.data.win.eventdata.targetFilename
    description: "File or directory being staged"
  incident_api_url:
    type: url
    required: false
    env: INCIDENT_API_URL
    description: "Base URL of the incident / ticketing API (deployment setting, from .env)"

cacao:
  type: playbook
  spec_version: cacao-2.0
  id: "playbook--5ea9bbce-3124-4250-bbca-af157c0d9e2f"
  name: "Respond to Data Collection on {{hostname}}"
  description: "Isolate {{hostname}}, preserve evidence, block outbound if src_ip known"
  playbook_types:
    - investigation
    - prevention
    - notification
  agent_definitions:
    linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50:
      type: linux
      name: "AI4SOAR / Shuffle"
      description: "Runs the steps; each one acts over SSH on its target machine"
      address:
        ipv4:
          - "127.0.0.1"
    http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b:
      type: http-api
      name: "Incident / ticketing API"
      address:
        url:
          - "{{incident_api_url}}"
  target_definitions:
    ssh--b78b919b-445f-5085-81fe-0597bb4a5249:
      type: ssh
      name: "Affected host {{hostname}}"
      description: "The machine the steps act on (the victim). In Shuffle, fill User name and Private key file id (or Password) of an account with root rights on it."
      address:
        dname:
          - "{{hostname}}"
  workflow_start: "step--start"
  workflow:

    # CACAO 2.0 requires every playbook to contain a start step, and
    # workflow_start MUST reference it (see data/cacao-schemas/playbook.json).
    step--start:
      type: start
      on_completion: "step--isolate-host"

    step--isolate-host:
      type: action
      # Everything the host sends is dropped, open connections included (an upload in
      # progress), except SSH replies so the responders keep access and loopback so
      # local services keep talking to each other. Inbound services keep running.
      name: "Block outbound data transfer from {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--b78b919b-445f-5085-81fe-0597bb4a5249"]
      commands:
        - type: bash
          command: |
            iptables -I OUTPUT 1 -o lo -j ACCEPT
            iptables -I OUTPUT 2 -p tcp --sport 22 -j ACCEPT
            iptables -I OUTPUT 3 -j DROP
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] BLOCKED outbound from {{hostname}} ({{src_ip}}), SSH replies only" | tee -a /var/log/ai4soar_blocks.log
      on_success: "step--preserve-evidence"
      on_failure: "step--preserve-evidence"
    step--preserve-evidence:
      type: action
      name: "Preserve staged files and process list on {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--b78b919b-445f-5085-81fe-0597bb4a5249"]
      commands:
        - type: bash
          command: >
            ls -lah -- '{{file_path}}' > /root/ai4soar_collection_{{hostname}}.txt 2>&1;
             ps auxf >> /root/ai4soar_collection_{{hostname}}.txt;
             find /tmp /var/tmp /dev/shm -mmin -1440 -type f -ls >> /root/ai4soar_collection_{{hostname}}.txt 2>/dev/null
      on_completion: "step--notify"
    step--notify:
      type: action
      name: "Escalate data collection alert"
      agent: "http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b"
      commands:
        - type: http-api
          command: "POST /api/v1/incidents HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: '{"title":"Suspicious Data Collection on {{hostname}}","severity":"high","host":"{{hostname}}","user":"{{username}}","file":"{{file_path}}","technique":"T1074"}'
      on_completion: "step--end"
    step--end:
      type: end
