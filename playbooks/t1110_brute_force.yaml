id: pb-t1110-block-brute-force
name: "Block Brute Force Source"
version: "1.1"
techniques:
  - T1110
  - T1110.001
  - T1110.003
tactics:
  - credential-access
description: "Block the attacking IP at the network perimeter, schedule auto-expiry, and lock the targeted account"

parameters:
  src_ip:
    type: ipv4
    required: true
    sources:
      - _source.data.srcip
      - data.srcip
      - srcip
    description: "Source IP performing the brute force — used in firewall DROP rules"
  hostname:
    type: string
    required: false
    sources:
      - _source.agent.name
      - agent.name
      - hostname
    description: "Target hostname (victim) — included in incident ticket and block log"
  username:
    type: string
    required: false
    sources:
      - _source.data.dstuser
      - data.dstuser
    description: "Targeted username — account will be locked via usermod -L; step is skipped on failure if not available"
  duration_hours:
    type: integer
    required: false
    default: 24
    description: "IP block duration in hours — used by 'at' to schedule automatic rule removal"
  incident_api_url:
    type: url
    required: false
    env: INCIDENT_API_URL
    description: "Base URL of the incident / ticketing API (deployment setting, from .env)"

cacao:
  type: playbook
  spec_version: cacao-2.0
  id: "playbook--447c6b45-26ba-4bd8-8afa-076f0f37c3dc"
  name: "Block Brute Force from {{src_ip}}"
  description: >
    Block {{src_ip}} at the firewall for {{duration_hours}}h (auto-expires),
    lock account {{username}} on {{hostname}}, and open an incident ticket.
  playbook_types:
    - prevention
    - remediation
    - notification
  agent_definitions:
    linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50:
      type: linux
      name: "AI4SOAR / Shuffle"
      description: "Runs the steps; each one acts over SSH on its target machine"
      address:
        ipv4:
          - "127.0.0.1"
    http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b:
      type: http-api
      name: "Incident / ticketing API"
      address:
        url:
          - "{{incident_api_url}}"
  target_definitions:
    ssh--c31348ce-3cb1-546c-af45-1172fa66772f:
      type: ssh
      name: "Affected host {{hostname}}"
      description: "The machine the steps act on (the victim). In Shuffle, fill User name and Private key file id (or Password) of an account with root rights on it."
      address:
        dname:
          - "{{hostname}}"
  workflow_start: "step--start"
  workflow:

    # CACAO 2.0 requires every playbook to contain a start step, and
    # workflow_start MUST reference it (see data/cacao-schemas/playbook.json).
    step--start:
      type: start
      on_completion: "step--block-ip"

    # Step 1 — Drop attacker IP immediately and schedule auto-expiry via `at`
    step--block-ip:
      type: action
      name: "Block {{src_ip}} at firewall for {{duration_hours}}h"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--c31348ce-3cb1-546c-af45-1172fa66772f"]
      commands:
        - type: bash
          command: >
            iptables -I INPUT  -s {{src_ip}} -j DROP
        - type: bash
          # Schedule automatic rule removal after duration_hours
          command: >
            echo "iptables -D INPUT -s {{src_ip}} -j DROP" |
            at now + {{duration_hours}} hours 2>&1
        - type: bash
          # Log only if the block rule is really in place (iptables -C checks it exists)
          command: >
            iptables -C INPUT -s {{src_ip}} -j DROP
            && echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] BLOCKED {{src_ip}} for {{duration_hours}}h (host={{hostname}})"
            | tee -a /var/log/ai4soar_blocks.log
      on_success: "step--lock-account"
      on_failure: "step--lock-account"   # always proceed; ticket captures the failure

    # Step 2 — Lock the targeted user account so stolen credentials are invalidated
    #           on_failure is intentional: if username is absent or lock fails,
    #           the workflow still creates an incident ticket rather than stopping.
    step--lock-account:
      type: action
      name: "Lock account {{username}} on {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--c31348ce-3cb1-546c-af45-1172fa66772f"]
      commands:
        - type: bash
          command: >
            usermod -L -e 1 {{username}}
            && echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] LOCKED account {{username}} on {{hostname}}"
            | tee -a /var/log/ai4soar_blocks.log
      on_success: "step--create-ticket"
      on_failure: "step--create-ticket"

    # Step 3 — Open an incident ticket with all four parameters captured
    step--create-ticket:
      type: action
      name: "Create security incident ticket"
      agent: "http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b"
      commands:
        - type: http-api
          command: "POST /api/v1/incidents HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: >
            {
              "title":           "Brute Force blocked from {{src_ip}}",
              "severity":        "high",
              "technique":       "T1110",
              "src_ip":          "{{src_ip}}",
              "hostname":        "{{hostname}}",
              "username":        "{{username}}",
              "block_duration_h": "{{duration_hours}}"
            }
      on_completion: "step--end"

    step--end:
      type: end
