id: pb-t1562-restore-defenses
name: "Restore Disabled Security Defenses"
version: "1.0"
techniques:
  - T1562
  - T1562.001
  - T1562.002
  - T1562.004
tactics:
  - defense-evasion
description: "Re-enable disabled AV/EDR and firewall, restore audit logging, and investigate who disabled them"

parameters:
  hostname:
    type: string
    required: true
    sources:
      - _source.agent.name
      - agent.name
      - hostname
    description: "Host where defenses were disabled"
  username:
    type: string
    required: false
    sources:
      - _source.data.srcuser
      - data.srcuser
    description: "User account that disabled defenses"
  src_ip:
    type: ipv4
    required: false
    sources:
      - _source.data.srcip
      - data.srcip
    description: "Host IP address"
  incident_api_url:
    type: url
    required: false
    env: INCIDENT_API_URL
    description: "Base URL of the incident / ticketing API (deployment setting, from .env)"

cacao:
  type: playbook
  spec_version: cacao-2.0
  id: "playbook--a8d2b6c5-9e3f-4a7b-2c5d-6f0e4a8b1c3d"
  name: "Restore Security Defenses on {{hostname}}"
  description: "Re-enable AV, firewall, and audit logging on {{hostname}}; investigate the account {{username}} that disabled them"
  playbook_types:
    - remediation
    - investigation
    - notification
  agent_definitions:
    linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50:
      type: linux
      name: "AI4SOAR / Shuffle"
      description: "Runs the steps; each one acts over SSH on its target machine"
      address:
        ipv4:
          - "127.0.0.1"
    http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b:
      type: http-api
      name: "Incident / ticketing API"
      address:
        url:
          - "{{incident_api_url}}"
  target_definitions:
    ssh--8762ae30-c782-5200-b79c-20aa42af388c:
      type: ssh
      name: "Affected host {{hostname}}"
      description: "The machine the steps act on (the victim). In Shuffle, fill User name and Private key file id (or Password) of an account with root rights on it."
      address:
        dname:
          - "{{hostname}}"
  workflow_start: "step--start"
  workflow:

    # CACAO 2.0 requires every playbook to contain a start step, and
    # workflow_start MUST reference it (see data/cacao-schemas/playbook.json).
    step--start:
      type: start
      on_completion: "step--restore-av"

    step--restore-av:
      type: action
      name: "Re-enable AV/EDR service on {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--8762ae30-c782-5200-b79c-20aa42af388c"]
      commands:
        - type: bash
          command: >
            systemctl start wazuh-agent 2>/dev/null || true;
             systemctl enable wazuh-agent 2>/dev/null || true;
             systemctl start clamav-daemon 2>/dev/null || systemctl start clamd@scan 2>/dev/null || echo "No ClamAV service on {{hostname}}"
        - type: bash
          command: >
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] AV RE-ENABLED on {{hostname}}" | tee -a /var/log/ai4soar_blocks.log
      on_success: "step--restore-firewall"
      on_failure: "step--restore-firewall"

    step--restore-firewall:
      type: action
      name: "Re-enable host firewall on {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--8762ae30-c782-5200-b79c-20aa42af388c"]
      commands:
        - type: bash
          command: >
            systemctl start firewalld 2>/dev/null || ufw --force enable 2>/dev/null || { [ -f /etc/iptables/rules.v4 ] && iptables-restore < /etc/iptables/rules.v4 && echo "iptables rules restored from /etc/iptables/rules.v4"; } || echo "No firewall service or saved ruleset on {{hostname}}"
      on_success: "step--restore-logging"
      on_failure: "step--restore-logging"

    step--restore-logging:
      type: action
      name: "Re-enable audit/event logging on {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--8762ae30-c782-5200-b79c-20aa42af388c"]
      commands:
        - type: bash
          command: >
            systemctl start auditd 2>/dev/null || true;
             systemctl enable auditd 2>/dev/null || true;
             auditctl -e 1 2>/dev/null || true
      on_success: "step--investigate-actor"
      on_failure: "step--investigate-actor"

    step--investigate-actor:
      type: action
      name: "Collect evidence of who disabled defenses"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--8762ae30-c782-5200-b79c-20aa42af388c"]
      commands:
        - type: bash
          command: >
            last -20 {{username}} 2>/dev/null > /tmp/ai4soar_actor_{{hostname}}.txt;
             journalctl --since '1 hour ago' -u wazuh-agent -u auditd -u ufw -u firewalld -u clamav-daemon 2>/dev/null >> /tmp/ai4soar_actor_{{hostname}}.txt;
             grep -h 'sudo:' /var/log/auth.log /var/log/secure 2>/dev/null | tail -50 >> /tmp/ai4soar_actor_{{hostname}}.txt || true
      on_completion: "step--create-ticket"

    step--create-ticket:
      type: action
      name: "Create defense evasion incident ticket"
      agent: "http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b"
      commands:
        - type: http-api
          command: "POST /api/v1/incidents HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: >
            {
              "title":     "Security Defenses Disabled on {{hostname}}",
              "severity":  "high",
              "technique": "T1562",
              "hostname":  "{{hostname}}",
              "username":  "{{username}}",
              "src_ip":    "{{src_ip}}"
            }
      on_completion: "step--end"

    step--end:
      type: end
