id: pb-t1003-respond-credential-dump
name: "Respond to Credential Dumping"
version: "1.0"
techniques:
  - T1003
  - T1003.001
  - T1003.002
  - T1003.006
tactics:
  - credential-access
description: "Kill the dump tool, lock the exposed account and force a password change, collect logon history, and alert the SOC"

parameters:
  hostname:
    type: string
    required: true
    sources:
      - _source.agent.name
      - agent.name
      - hostname
    description: "Host where credential dumping was detected"
  username:
    type: string
    required: false
    sources:
      - _source.data.srcuser
      - data.srcuser
    description: "Account observed in the dump activity"
  src_ip:
    type: ipv4
    required: false
    sources:
      - _source.data.srcip
      - data.srcip
    description: "Host IP"
  incident_api_url:
    type: url
    required: false
    env: INCIDENT_API_URL
    description: "Base URL of the incident / ticketing API (deployment setting, from .env)"

cacao:
  type: playbook
  spec_version: cacao-2.0
  id: "playbook--d5a9e3f2-6b0c-4d4e-9f2a-3c7b1d5e8f0a"
  name: "Respond to Credential Dump on {{hostname}}"
  description: "Kill credential dump process on {{hostname}}, force password reset for {{username}}, notify SOC"
  playbook_types:
    - remediation
    - notification
  agent_definitions:
    linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50:
      type: linux
      name: "AI4SOAR / Shuffle"
      description: "Runs the steps; each one acts over SSH on its target machine"
      address:
        ipv4:
          - "127.0.0.1"
    http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b:
      type: http-api
      name: "Incident / ticketing API"
      address:
        url:
          - "{{incident_api_url}}"
  target_definitions:
    ssh--9549da68-90af-559f-bf9c-24fe9a1f77e7:
      type: ssh
      name: "Affected host {{hostname}}"
      description: "The machine the steps act on (the victim). In Shuffle, fill User name and Private key file id (or Password) of an account with root rights on it."
      address:
        dname:
          - "{{hostname}}"
  workflow_start: "step--start"
  workflow:

    # CACAO 2.0 requires every playbook to contain a start step, and
    # workflow_start MUST reference it (see data/cacao-schemas/playbook.json).
    step--start:
      type: start
      on_completion: "step--kill-dump-process"

    step--kill-dump-process:
      type: action
      name: "Kill credential dumping process on {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--9549da68-90af-559f-bf9c-24fe9a1f77e7"]
      commands:
        - type: bash
          # -x: exact process name. Never match lsass itself: it is the dump TARGET,
          # and killing it forces a reboot on Windows.
          command: >
            pkill -9 -x 'procdump|procdump64|mimikatz|gsecdump|wce|fgdump|pypykatz'
            && echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] KILLED dump process on {{hostname}}" >> /var/log/ai4soar_blocks.log
            || echo "Nothing killed on {{hostname}} (no dump tool running, or host unreachable)"
      on_success: "step--force-password-reset"
      on_failure: "step--force-password-reset"

    step--force-password-reset:
      type: action
      # The attacker may hold the current password, so expiring it alone is not enough
      # (they could log in and set a new one): lock the account and expire the password;
      # an admin unlocks it once the user has a new one.
      name: "Lock {{username}} on {{hostname}} and force a password change"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--9549da68-90af-559f-bf9c-24fe9a1f77e7"]
      commands:
        - type: bash
          command: >
            usermod -L {{username}} && chage -d 0 {{username}}
            && echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] LOCKED {{username}} + password expired on {{hostname}}" >> /var/log/ai4soar_blocks.log
      on_success: "step--audit-logons"
      on_failure: "step--audit-logons"

    step--audit-logons:
      type: action
      name: "Collect recent logon events from {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--9549da68-90af-559f-bf9c-24fe9a1f77e7"]
      commands:
        - type: bash
          command: >
            last -20 > /tmp/ai4soar_logons_{{hostname}}.txt 2>/dev/null || true
      on_completion: "step--create-ticket"

    step--create-ticket:
      type: action
      name: "Create credential dump incident ticket"
      agent: "http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b"
      commands:
        - type: http-api
          command: "POST /api/v1/incidents HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: >
            {
              "title":     "Credential Dumping on {{hostname}}",
              "severity":  "critical",
              "technique": "T1003",
              "hostname":  "{{hostname}}",
              "src_ip":    "{{src_ip}}",
              "username":  "{{username}}"
            }
      on_completion: "step--end"

    step--end:
      type: end
