id: pb-t1499-block-dos-source
name: "Block Denial-of-Service Source"
version: "1.0"
techniques:
  - T1498
  - T1498.001
  - T1498.002
  - T1499
  - T1499.001
  - T1499.002
  - T1499.003
  - T1499.004
tactics:
  - impact
description: "Block the flooding source IP at the firewall, rate-limit the targeted service port, and open an incident ticket"

parameters:
  src_ip:
    type: ipv4
    required: true
    sources:
      - _source.data.srcip
      - data.srcip
      - srcip
    description: "Source IP performing the flood — blocked at the firewall"
  dst_port:
    type: integer
    required: false
    sources:
      - _source.data.dstport
      - data.dstport
    description: "Targeted destination port — used to apply per-port rate limiting; step skipped if absent"
  hostname:
    type: string
    required: false
    sources:
      - _source.agent.name
      - agent.name
      - hostname
    description: "Affected host — included in incident ticket and block log"
  duration_hours:
    type: integer
    required: false
    default: 24
    description: "IP block duration in hours — auto-expires via 'at' scheduler"
  incident_api_url:
    type: url
    required: false
    env: INCIDENT_API_URL
    description: "Base URL of the incident / ticketing API (deployment setting, from .env)"

cacao:
  type: playbook
  spec_version: cacao-2.0
  id: "playbook--c3f1a9b2-7e5d-4c8a-b2d3-4e5f6a7b8c9d"
  name: "Block DoS from {{src_ip}}"
  description: >
    Block {{src_ip}} for {{duration_hours}}h (auto-expires),
    rate-limit port {{dst_port}} on {{hostname}}, and open an incident ticket.
  playbook_types:
    - prevention
    - remediation
    - notification
  agent_definitions:
    linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50:
      type: linux
      name: "AI4SOAR / Shuffle"
      description: "Runs the steps; each one acts over SSH on its target machine"
      address:
        ipv4:
          - "127.0.0.1"
    http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b:
      type: http-api
      name: "Incident / ticketing API"
      address:
        url:
          - "{{incident_api_url}}"
  target_definitions:
    ssh--7031b52a-202a-51dd-9a52-8e62949e4e62:
      type: ssh
      name: "Affected host {{hostname}}"
      description: "The machine the steps act on (the victim). In Shuffle, fill User name and Private key file id (or Password) of an account with root rights on it."
      address:
        dname:
          - "{{hostname}}"
  workflow_start: "step--start"
  workflow:

    # CACAO 2.0 requires every playbook to contain a start step, and
    # workflow_start MUST reference it (see data/cacao-schemas/playbook.json).
    step--start:
      type: start
      on_completion: "step--block-ip"

    # Step 1 — Drop attacker IP and schedule auto-expiry
    step--block-ip:
      type: action
      name: "Block {{src_ip}} at firewall for {{duration_hours}}h"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--7031b52a-202a-51dd-9a52-8e62949e4e62"]
      commands:
        - type: bash
          command: >
            iptables -I INPUT   -s {{src_ip}} -j DROP
        - type: bash
          command: >
            echo "iptables -D INPUT   -s {{src_ip}} -j DROP" |
            at now + {{duration_hours}} hours 2>&1
        - type: bash
          command: >
            iptables -C INPUT -s {{src_ip}} -j DROP
            && echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] BLOCKED {{src_ip}} for {{duration_hours}}h (DoS, host={{hostname}})"
            | tee -a /var/log/ai4soar_blocks.log
      on_success: "step--rate-limit"
      on_failure: "step--rate-limit"

    # Step 2 — Rate-limit the targeted port so the service survives if the block
    #           rule arrives late or is bypassed by a rotated source IP.
    #           on_failure is intentional: ticket is created regardless.
    step--rate-limit:
      type: action
      name: "Rate-limit port {{dst_port}} on {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--7031b52a-202a-51dd-9a52-8e62949e4e62"]
      commands:
        - type: bash
          # Per source address: any client opening more than 20 new connections a second
          # to the port is dropped, the others are untouched. A DROP rule, so it cannot
          # let the blocked attacker back in whatever its position. Numeric check also
          # skips an unfilled placeholder. Expires with the block.
          command: |
            case "{{dst_port}}" in
              ''|*[!0-9]*) echo "No usable dst_port: skipping rate-limit rule" ;;
              *) iptables -I INPUT -p tcp --dport {{dst_port}} -m conntrack --ctstate NEW -m hashlimit --hashlimit-mode srcip --hashlimit-above 20/sec --hashlimit-burst 50 --hashlimit-name ai4soar_dos -j DROP
                 echo "iptables -D INPUT -p tcp --dport {{dst_port}} -m conntrack --ctstate NEW -m hashlimit --hashlimit-mode srcip --hashlimit-above 20/sec --hashlimit-burst 50 --hashlimit-name ai4soar_dos -j DROP" | at now + {{duration_hours}} hours 2>&1 ;;
            esac
      on_success: "step--create-ticket"
      on_failure: "step--create-ticket"

    # Step 4 — Open incident ticket
    step--create-ticket:
      type: action
      name: "Create DoS incident ticket"
      agent: "http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b"
      commands:
        - type: http-api
          command: "POST /api/v1/incidents HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: >
            {
              "title":            "DoS attack blocked from {{src_ip}}",
              "severity":         "high",
              "technique":        "T1499",
              "src_ip":           "{{src_ip}}",
              "dst_port":         "{{dst_port}}",
              "hostname":         "{{hostname}}",
              "block_duration_h": "{{duration_hours}}"
            }
      on_completion: "step--end"

    step--end:
      type: end
