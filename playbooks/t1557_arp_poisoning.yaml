id: pb-t1557-arp-poisoning
name: "Respond to ARP Poisoning / IP Conflict"
version: "1.0"
techniques:
  - T1557
  - T1557.002
tactics:
  - credential-access
description: "Capture the conflicting ARP frames, flush the disputed IP's ARP cache entry, and open an incident ticket for manual MAC verification — never auto-blocks, since an ARP conflict alert names a disputed IP claimed by two MACs and cannot tell which one is the attacker."

parameters:
  disputed_ip:
    type: ipv4
    required: true
    sources:
      - _source.data.srcip
      - data.srcip
      - srcip
    description: "The IP address whose ARP binding is in conflict — NOT a confirmed attacker IP, see description"
  hostname:
    type: string
    required: false
    sources:
      - _source.agent.name
      - agent.name
    description: "Sensor/host that observed the conflicting ARP frames"
  incident_api_url:
    type: url
    required: false
    env: INCIDENT_API_URL
    description: "Base URL of the incident / ticketing API (deployment setting, from .env)"

cacao:
  type: playbook
  spec_version: cacao-2.0
  id: "playbook--8b6e2d5b-6a3d-4c8a-9c8e-2b6c0f4a7a3f"
  name: "Investigate ARP Conflict on {{disputed_ip}}"
  description: "Capture evidence for {{disputed_ip}}, flush its ARP cache entry, and flag both claimed MACs for manual verification"
  playbook_types:
    - investigation
    - notification
  agent_definitions:
    linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50:
      type: linux
      name: "AI4SOAR / Shuffle"
      description: "Runs the steps; each one acts over SSH on its target machine"
      address:
        ipv4:
          - "127.0.0.1"
    http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b:
      type: http-api
      name: "Incident / ticketing API"
      address:
        url:
          - "{{incident_api_url}}"
  target_definitions:
    ssh--98baaae3-0518-54ac-9909-24a49a4452ab:
      type: ssh
      name: "Affected host {{hostname}}"
      description: "The machine the steps act on (the victim). In Shuffle, fill User name and Private key file id (or Password) of an account with root rights on it."
      address:
        dname:
          - "{{hostname}}"
  workflow_start: "step--start"
  workflow:

    # CACAO 2.0 requires every playbook to contain a start step, and
    # workflow_start MUST reference it (see data/cacao-schemas/playbook.json).
    step--start:
      type: start
      on_completion: "step--capture-evidence"

    # Step 1 — Capture the conflicting ARP traffic before it ages out of any
    # local capture buffer; this is the only place the two competing MAC
    # addresses are still visible together.
    step--capture-evidence:
      type: action
      name: "Capture ARP traffic for {{disputed_ip}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--98baaae3-0518-54ac-9909-24a49a4452ab"]
      commands:
        - type: bash
          command: "timeout 10 tcpdump -i any -c 50 'arp and host {{disputed_ip}}' -w /tmp/arp_evidence_{{disputed_ip}}_$(date +%s).pcap 2>&1"
      on_completion: "step--flush-cache"
    step--flush-cache:
      type: action
      name: "Flush stale ARP cache entry for {{disputed_ip}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--98baaae3-0518-54ac-9909-24a49a4452ab"]
      commands:
        - type: bash
          # Non-destructive: forces re-resolution rather than blocking
          # either candidate MAC outright, since guessing wrong would
          # disconnect the legitimate host.
          command: "arp -d {{disputed_ip}} 2>/dev/null || true"
      on_completion: "step--notify"
    step--notify:
      type: action
      name: "Create investigation ticket for manual MAC verification"
      agent: "http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b"
      commands:
        - type: http-api
          command: "POST /api/v1/incidents HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: '{"title":"ARP conflict on {{disputed_ip}}","severity":"medium","host":"{{hostname}}","disputed_ip":"{{disputed_ip}}","technique":"T1557","action_required":"verify_mac_ownership_manually"}'
      on_completion: "step--end"
    step--end:
      type: end
