id: pb-t1566-quarantine-phishing
name: "Quarantine Phishing Email"
version: "1.0"
techniques:
  - T1566
  - T1566.001
  - T1566.002
tactics:
  - initial-access
description: "Quarantine the phishing email, block the sender address, and notify the recipient"

parameters:
  email_sender:
    type: string
    required: true
    sources:
      - _source.data.email.from
      - data.email.from
      - data.srcuser
    description: "Phishing email sender address"
  email_subject:
    type: text
    required: false
    sources:
      - _source.data.email.subject
      - data.email.subject
    description: "Email subject line"
  username:
    type: string
    required: false
    sources:
      - _source.data.dstuser
      - data.dstuser
    description: "Recipient username"
  src_ip:
    type: ipv4
    required: false
    sources:
      - _source.data.srcip
      - data.srcip
    description: "Sender mail server IP"
  incident_api_url:
    type: url
    required: false
    env: INCIDENT_API_URL
    description: "Base URL of the incident / ticketing API (deployment setting, from .env)"
  mail_api_url:
    type: url
    required: false
    env: MAIL_API_URL
    description: "Base URL of the mail gateway API (deployment setting, from .env)"
  mail_server:
    type: string
    required: false
    description: "Postfix server that filters incoming mail (not in the alert: the operator sets it)"

cacao:
  type: playbook
  spec_version: cacao-2.0
  id: "playbook--91525dcf-5146-4a38-b2f6-edd3acaa96f7"
  name: "Quarantine Phishing from {{email_sender}}"
  description: "Quarantine email from {{email_sender}} to {{username}} and block the sender address"
  playbook_types:
    - remediation
    - prevention
    - notification
  agent_definitions:
    linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50:
      type: linux
      name: "AI4SOAR / Shuffle"
      description: "Runs the steps; each one acts over SSH on its target machine"
      address:
        ipv4:
          - "127.0.0.1"
    http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b:
      type: http-api
      name: "Incident / ticketing API"
      address:
        url:
          - "{{incident_api_url}}"
    http-api--0d3e8f21-7a6b-4c5d-8e9f-2a3b4c5d6e7f:
      type: http-api
      name: "Mail gateway API"
      address:
        url:
          - "{{mail_api_url}}"
  target_definitions:
    ssh--318d9f5c-6ead-50fd-afe6-9937d85c2fdf:
      type: ssh
      name: "Mail server {{mail_server}}"
      description: "The Postfix mail server that filters incoming mail. In Shuffle, fill User name and Private key file id (or Password) of an account with root rights on it."
      address:
        dname:
          - "{{mail_server}}"
  workflow_start: "step--start"
  workflow:

    # CACAO 2.0 requires every playbook to contain a start step, and
    # workflow_start MUST reference it (see data/cacao-schemas/playbook.json).
    step--start:
      type: start
      on_completion: "step--quarantine-email"

    step--quarantine-email:
      type: action
      name: "Quarantine the phishing email"
      agent: "http-api--0d3e8f21-7a6b-4c5d-8e9f-2a3b4c5d6e7f"
      commands:
        - type: http-api
          command: "POST /api/v1/email/quarantine HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: '{"sender":"{{email_sender}}","recipient":"{{username}}","subject":"{{email_subject}}"}'
      on_success: "step--block-sender"
      on_failure: "step--block-sender"
    step--block-sender:
      type: action
      # Was: "postsuper -d ALL deferred" (deleted EVERY deferred mail in the queue, from
      # any sender) and a plain address appended to a file postfix never reads. A
      # postfix access map needs "<key> REJECT", postmap, and a reload. Blocks the sender
      # ADDRESS: blocking the whole domain would also block e.g. all of gmail.com.
      name: "Block sender {{email_sender}} in the mail filter"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--318d9f5c-6ead-50fd-afe6-9937d85c2fdf"]
      commands:
        - type: bash
          command: >
            echo '{{email_sender}} REJECT phishing (AI4SOAR)' >> /etc/postfix/sender_access
            && postmap /etc/postfix/sender_access && postfix reload
      on_completion: "step--notify"
    step--notify:
      type: action
      name: "Open a phishing incident for the SOC"
      agent: "http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b"
      commands:
        - type: http-api
          command: "POST /api/v1/incidents HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: '{"title":"Phishing Email from {{email_sender}}","severity":"high","recipient":"{{username}}","subject":"{{email_subject}}","technique":"T1566"}'
      on_completion: "step--end"
    step--end:
      type: end
