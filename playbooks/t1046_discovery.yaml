id: pb-t1046-respond-network-discovery
name: "Respond to Internal Network Discovery"
version: "1.0"
techniques:
  - T1046
  - T1083
  - T1082
  - T1087
  - T1135
  - T1018
tactics:
  - discovery
description: "Detect and contain reconnaissance/scanning activity from a compromised host"

parameters:
  src_ip:
    type: ipv4
    required: true
    sources:
      - _source.data.srcip
      - data.srcip
    description: "Source IP performing the scan or discovery"
  hostname:
    type: string
    required: false
    sources:
      - _source.agent.name
      - agent.name
    description: "Host generating discovery traffic"
  username:
    type: string
    required: false
    sources:
      - _source.data.dstuser
      - _source.data.win.eventdata.subjectUserName
    description: "User account associated with discovery"
  dst_ip:
    type: ipv4
    required: false
    sources:
      - _source.data.dstip
      - data.dstip
    description: "Target being scanned (if single target)"
  incident_api_url:
    type: url
    required: false
    env: INCIDENT_API_URL
    description: "Base URL of the incident / ticketing API (deployment setting, from .env)"

cacao:
  type: playbook
  spec_version: cacao-2.0
  id: "playbook--8e92fefe-6750-4c23-ac98-8ac2bbceab0a"
  name: "Contain Discovery Activity from {{src_ip}}"
  description: "Rate-limit or block {{src_ip}} scanning, investigate {{hostname}}"
  playbook_types:
    - prevention
    - investigation
    - notification
  agent_definitions:
    linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50:
      type: linux
      name: "AI4SOAR / Shuffle"
      description: "Runs the steps; each one acts over SSH on its target machine"
      address:
        ipv4:
          - "127.0.0.1"
    http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b:
      type: http-api
      name: "Incident / ticketing API"
      address:
        url:
          - "{{incident_api_url}}"
  target_definitions:
    ssh--e7f96b8f-1b3f-5846-91d7-e50c898cd62a:
      type: ssh
      name: "Affected host {{hostname}}"
      description: "The machine the steps act on (the victim). In Shuffle, fill User name and Private key file id (or Password) of an account with root rights on it."
      address:
        dname:
          - "{{hostname}}"
  workflow_start: "step--start"
  workflow:

    # CACAO 2.0 requires every playbook to contain a start step, and
    # workflow_start MUST reference it (see data/cacao-schemas/playbook.json).
    step--start:
      type: start
      on_completion: "step--rate-limit"

    step--rate-limit:
      type: action
      # On the scanning host: its new outgoing TCP connections (SYN) are limited to
      # 10/min. DROP is inserted before ACCEPT so the pair ends up as: ACCEPT up to
      # 10/min, then DROP (an appended DROP would sit behind rules that accept first).
      name: "Rate-limit new outgoing connections of {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--e7f96b8f-1b3f-5846-91d7-e50c898cd62a"]
      commands:
        - type: bash
          command: >
            iptables -I OUTPUT -p tcp --syn ! -o lo -j DROP
            && iptables -I OUTPUT -p tcp --syn ! -o lo -m limit --limit 10/min -j ACCEPT
            && echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] RATE-LIMITED new outgoing connections of {{hostname}} to 10/min" | tee -a /var/log/ai4soar_blocks.log
      on_success: "step--investigate"
      on_failure: "step--investigate"
    step--investigate:
      type: action
      # On the scanning host: which processes open the connections
      name: "Capture connections and processes on {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--e7f96b8f-1b3f-5846-91d7-e50c898cd62a"]
      commands:
        - type: bash
          command: >
            ss -tanp > /root/ai4soar_discovery_{{hostname}}.txt; ps auxf >> /root/ai4soar_discovery_{{hostname}}.txt;
             echo "Snapshot saved: /root/ai4soar_discovery_{{hostname}}.txt ($(wc -l < /root/ai4soar_discovery_{{hostname}}.txt) lines)"
      on_completion: "step--notify"
    step--notify:
      type: action
      name: "Alert SOC to reconnaissance activity"
      agent: "http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b"
      commands:
        - type: http-api
          command: "POST /api/v1/incidents HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: '{"title":"Network Discovery from {{src_ip}}","severity":"medium","src_ip":"{{src_ip}}","host":"{{hostname}}","user":"{{username}}","technique":"T1046"}'
      on_completion: "step--end"
    step--end:
      type: end
