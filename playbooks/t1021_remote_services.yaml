id: pb-t1021-block-lateral-movement
name: "Block Lateral Movement via Remote Services"
version: "1.0"
techniques:
  - T1021
  - T1021.001
  - T1021.002
  - T1021.004
  - T1021.006
tactics:
  - lateral-movement
description: "Block lateral movement from the source host and investigate the account used"

parameters:
  src_ip:
    type: ipv4
    required: true
    sources:
      - _source.data.srcip
      - data.srcip
      - srcip
    description: "Source IP initiating lateral movement"
  dst_ip:
    type: ipv4
    required: false
    sources:
      - _source.data.dstip
      - data.dstip
      - dstip
    description: "Target IP (destination host)"
  username:
    type: string
    required: false
    sources:
      - _source.data.dstuser
      - data.dstuser
      - _source.data.win.eventdata.subjectUserName
    description: "Account used for lateral movement"
  hostname:
    type: string
    required: false
    sources:
      - _source.agent.name
      - agent.name
    description: "Source hostname"
  protocol:
    type: string
    required: false
    sources:
      - _source.data.protocol
      - data.protocol
    default: "unknown"
    description: "Protocol used (ssh, rdp, smb, ...)"
  incident_api_url:
    type: url
    required: false
    env: INCIDENT_API_URL
    description: "Base URL of the incident / ticketing API (deployment setting, from .env)"

cacao:
  type: playbook
  spec_version: cacao-2.0
  id: "playbook--cec7fc29-ddb1-485e-96f8-142e66f02410"
  name: "Block Lateral Movement from {{src_ip}}"
  description: "Block {{src_ip}} → {{dst_ip}} ({{protocol}}) and investigate {{username}}"
  playbook_types:
    - prevention
    - investigation
    - notification
  agent_definitions:
    linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50:
      type: linux
      name: "AI4SOAR / Shuffle"
      description: "Runs the steps; each one acts over SSH on its target machine"
      address:
        ipv4:
          - "127.0.0.1"
    http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b:
      type: http-api
      name: "Incident / ticketing API"
      address:
        url:
          - "{{incident_api_url}}"
  target_definitions:
    ssh--c362ce6d-6420-5b0b-ae38-8a30487c6176:
      type: ssh
      name: "Affected host {{hostname}}"
      description: "The machine the steps act on (the victim). In Shuffle, fill User name and Private key file id (or Password) of an account with root rights on it."
      address:
        dname:
          - "{{hostname}}"
  workflow_start: "step--start"
  workflow:

    # CACAO 2.0 requires every playbook to contain a start step, and
    # workflow_start MUST reference it (see data/cacao-schemas/playbook.json).
    step--start:
      type: start
      on_completion: "step--block-src"

    step--block-src:
      type: action
      # Contain the whole source host, not one src->dst pair: a host moving laterally
      # is compromised, and dst_ip is optional (the rule would fail without it).
      name: "Block lateral movement source {{src_ip}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--c362ce6d-6420-5b0b-ae38-8a30487c6176"]
      commands:
        - type: bash
          command: >
            iptables -I INPUT -s {{src_ip}} -j DROP
            && echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] BLOCKED lateral movement source {{src_ip}}" | tee -a /var/log/ai4soar_blocks.log
      on_success: "step--isolate-account"
      on_failure: "step--isolate-account"
    step--isolate-account:
      type: action
      # -L locks the password, -e 1 expires the account so SSH keys stop working too
      name: "Lock account {{username}} used for lateral movement"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--c362ce6d-6420-5b0b-ae38-8a30487c6176"]
      commands:
        - type: bash
          command: >
            usermod -L -e 1 {{username}}
            || echo "Account lock failed on {{hostname}}: domain accounts need AD/LDAP integration"
      on_completion: "step--notify"
    step--notify:
      type: action
      name: "Alert SOC of lateral movement"
      agent: "http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b"
      commands:
        - type: http-api
          command: "POST /api/v1/incidents HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: '{"title":"Lateral Movement {{src_ip}}→{{dst_ip}}","severity":"critical","technique":"T1021","protocol":"{{protocol}}","user":"{{username}}"}'
      on_completion: "step--end"
    step--end:
      type: end
