id: pb-t1071-block-c2-channel
name: "Block C2 Communication over HTTP/S"
version: "1.0"
techniques:
  - T1071
  - T1071.001
  - T1572
tactics:
  - command-and-control
description: "Block the C2 channel at the perimeter, collect connection and process evidence from the beaconing host, and block the C2 server for the whole network"

parameters:
  src_ip:
    type: ipv4
    required: true
    sources:
      - _source.data.srcip
      - data.srcip
      - srcip
    description: "Internal host making C2 connections"
  hostname:
    type: string
    required: false
    sources:
      - _source.agent.name
      - agent.name
      - hostname
    description: "Beaconing host name"
  dst_ip:
    type: ipv4
    required: false
    sources:
      - _source.data.dstip
      - data.dstip
      - dstip
    description: "External C2 server IP to block"
  incident_api_url:
    type: url
    required: false
    env: INCIDENT_API_URL
    description: "Base URL of the incident / ticketing API (deployment setting, from .env)"

cacao:
  type: playbook
  spec_version: cacao-2.0
  id: "playbook--e6b0f4a3-7c1d-4e5f-0a3b-4d8c2e6f9a1b"
  name: "Block C2 from {{src_ip}} to {{dst_ip}}"
  description: "Block outbound C2 traffic from {{src_ip}} to {{dst_ip}}, collect netstat/connection evidence"
  playbook_types:
    - prevention
    - remediation
    - investigation
  agent_definitions:
    linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50:
      type: linux
      name: "AI4SOAR / Shuffle"
      description: "Runs the steps; each one acts over SSH on its target machine"
      address:
        ipv4:
          - "127.0.0.1"
    http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b:
      type: http-api
      name: "Incident / ticketing API"
      address:
        url:
          - "{{incident_api_url}}"
  target_definitions:
    ssh--85049bae-30ba-5773-a9d1-5890a736e7ea:
      type: ssh
      name: "Affected host {{hostname}}"
      description: "The machine the steps act on (the victim). In Shuffle, fill User name and Private key file id (or Password) of an account with root rights on it."
      address:
        dname:
          - "{{hostname}}"
  workflow_start: "step--start"
  workflow:

    # CACAO 2.0 requires every playbook to contain a start step, and
    # workflow_start MUST reference it (see data/cacao-schemas/playbook.json).
    step--start:
      type: start
      on_completion: "step--collect-connections"

    step--block-outbound:
      type: action
      name: "Block outbound C2 traffic from {{src_ip}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--85049bae-30ba-5773-a9d1-5890a736e7ea"]
      commands:
        - type: bash
          command: >
            iptables -I OUTPUT -d {{dst_ip}} -j DROP
            && echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] BLOCKED C2 {{src_ip}} -> {{dst_ip}}" | tee -a /var/log/ai4soar_blocks.log
      on_success: "step--dns-block"
      on_failure: "step--dns-block"

    # Evidence first: once blocked, the C2 connections drop out of netstat / ss
    step--collect-connections:
      type: action
      name: "Collect active connection evidence from {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--85049bae-30ba-5773-a9d1-5890a736e7ea"]
      commands:
        - type: bash
          command: >
            netstat -antp 2>/dev/null > /tmp/ai4soar_netstat_{{hostname}}.txt;
             ss -antp 2>/dev/null >> /tmp/ai4soar_netstat_{{hostname}}.txt
        - type: bash
          command: >
            ps auxf > /tmp/ai4soar_procs_{{hostname}}.txt 2>/dev/null || true
      on_success: "step--block-outbound"
      on_failure: "step--block-outbound"

    step--dns-block:
      type: action
      # Outbound to the C2 server is blocked in step 1; this also drops anything the
      # server sends to the host. Other hosts are protected at the perimeter firewall.
      name: "Block inbound traffic from C2 server {{dst_ip}} on {{hostname}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--85049bae-30ba-5773-a9d1-5890a736e7ea"]
      commands:
        - type: bash
          command: >
            iptables -I INPUT -s {{dst_ip}} -j DROP
            && echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] BLOCKED inbound from C2 server {{dst_ip}}" | tee -a /var/log/ai4soar_blocks.log
      on_completion: "step--create-ticket"

    step--create-ticket:
      type: action
      name: "Create C2 beaconing incident ticket"
      agent: "http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b"
      commands:
        - type: http-api
          command: "POST /api/v1/incidents HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: >
            {
              "title":     "C2 Beaconing from {{hostname}} ({{src_ip}}) to {{dst_ip}}",
              "severity":  "high",
              "technique": "T1071",
              "hostname":  "{{hostname}}",
              "src_ip":    "{{src_ip}}",
              "dst_ip":    "{{dst_ip}}"
            }
      on_completion: "step--end"

    step--end:
      type: end
