id: pb-t1078-respond-compromised-account
name: "Respond to Compromised Account"
version: "1.0"
techniques:
  - T1078
  - T1078.001
  - T1078.002
  - T1078.003
tactics:
  - initial-access
  - persistence
  - privilege-escalation
  - defense-evasion
description: "Disable the compromised account, revoke sessions, and notify the user"

parameters:
  username:
    type: string
    required: true
    sources:
      - _source.data.dstuser
      - data.dstuser
      - _source.data.win.eventdata.subjectUserName
    description: "Compromised account username"
  src_ip:
    type: ipv4
    required: false
    sources:
      - _source.data.srcip
      - data.srcip
    description: "IP address used by the attacker"
  hostname:
    type: string
    required: false
    sources:
      - _source.agent.name
      - agent.name
    description: "Affected host"
  incident_api_url:
    type: url
    required: false
    env: INCIDENT_API_URL
    description: "Base URL of the incident / ticketing API (deployment setting, from .env)"

cacao:
  type: playbook
  spec_version: cacao-2.0
  id: "playbook--d412acc9-886d-4a36-b700-934b5737db9e"
  name: "Respond to Compromised Account {{username}}"
  description: "Disable {{username}}, revoke active sessions, block {{src_ip}}"
  playbook_types:
    - remediation
    - prevention
    - notification
  agent_definitions:
    linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50:
      type: linux
      name: "AI4SOAR / Shuffle"
      description: "Runs the steps; each one acts over SSH on its target machine"
      address:
        ipv4:
          - "127.0.0.1"
    http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b:
      type: http-api
      name: "Incident / ticketing API"
      address:
        url:
          - "{{incident_api_url}}"
  target_definitions:
    ssh--2b62d3f4-0e4e-5540-9519-06d818b1f400:
      type: ssh
      name: "Affected host {{hostname}}"
      description: "The machine the steps act on (the victim). In Shuffle, fill User name and Private key file id (or Password) of an account with root rights on it."
      address:
        dname:
          - "{{hostname}}"
  workflow_start: "step--start"
  workflow:

    # CACAO 2.0 requires every playbook to contain a start step, and
    # workflow_start MUST reference it (see data/cacao-schemas/playbook.json).
    step--start:
      type: start
      on_completion: "step--disable-account"

    step--disable-account:
      type: action
      # -L locks the password, -e 1 expires the
      # account (also stops SSH-key logins), pkill ends the sessions already open, as the
      # description promises. (passwd -l was the same as usermod -L; net user is Windows.)
      name: "Disable {{username}} on {{hostname}} and end its sessions"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--2b62d3f4-0e4e-5540-9519-06d818b1f400"]
      commands:
        - type: bash
          command: >
            usermod -L -e 1 {{username}} && { pkill -KILL -u {{username}}; true; }
            && echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] DISABLED {{username}} on {{hostname}}" | tee -a /var/log/ai4soar_blocks.log
      on_success: "step--block-ip"
      on_failure: "step--block-ip"
    step--block-ip:
      type: action
      name: "Block attacker IP {{src_ip}}"
      agent: "linux--3a7f9c1e-5b2d-4c8a-9e6f-7d1b2c3e4f50"
      targets: ["ssh--2b62d3f4-0e4e-5540-9519-06d818b1f400"]
      commands:
        - type: bash
          command: >
            iptables -I INPUT -s {{src_ip}} -j DROP
            && echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] BLOCKED {{src_ip}} (compromised account {{username}})" | tee -a /var/log/ai4soar_blocks.log
            || echo "No usable src_ip: attacker IP not blocked"
      on_completion: "step--notify"
    step--notify:
      type: action
      name: "Notify security team and user"
      agent: "http-api--6f1c2a7e-3b4d-4e5f-9a8b-1c2d3e4f5a6b"
      commands:
        - type: http-api
          command: "POST /api/v1/incidents HTTP/1.1"
          headers:
            Content-Type: ["application/json"]
          content: '{"title":"Compromised Account: {{username}}","severity":"critical","user":"{{username}}","src_ip":"{{src_ip}}","host":"{{hostname}}","technique":"T1078"}'
      on_completion: "step--end"
    step--end:
      type: end
