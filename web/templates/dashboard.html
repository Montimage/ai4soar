{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h4 class="mb-0 fw-bold">Integration Status</h4>
    <small class="text-muted">Real-time connectivity check for all SOAR platform integrations</small>
  </div>
  <button class="btn btn-outline-primary btn-sm" onclick="loadHealth()">
    <i class="bi bi-arrow-clockwise me-1"></i>Refresh
  </button>
</div>

<!-- Integration cards -->
<div class="mb-4" id="integration-cards">
  <!-- populated by JS -->
</div>

{% endblock %}

{% block scripts %}
<script>
const GROUPS = [
  { title: 'SOAR Platform' },
  { title: 'Database' },
  { title: 'Messaging Brokers' },
  { title: 'LLM Providers' },
];

const INTEGRATIONS = [
  { group: 'SOAR Platform',     key: 'shuffle',   label: 'Shuffle',        urlKey: 'url'      },
  { group: 'Database',          key: 'mongodb',   label: 'MongoDB',        urlKey: 'url'      },
  { group: 'Messaging Brokers', key: 'kafka',     label: 'Kafka',          urlKey: 'broker'   },
  { group: 'Messaging Brokers', key: 'nats',      label: 'NATS',           urlKey: 'url'      },
  { group: 'LLM Providers',     key: 'anthropic', label: 'Anthropic',      urlKey: 'provider' },
  { group: 'LLM Providers',     key: 'openai',    label: 'OpenAI',         urlKey: 'provider' },
  { group: 'LLM Providers',     key: 'ollama',    label: 'Ollama (local)', urlKey: 'provider' },
];

/* One section per group: heading (+ "n of m connected" once loaded) and a row of cards */
function renderGroups(cardHtml, data) {
  return GROUPS.map(({ title }) => {
    const items = INTEGRATIONS.filter(i => i.group === title);
    let summary = '';
    if (data) {
      const ok = items.filter(i => (data[i.key] || {}).status === 'ok').length;
      summary = `<span class="text-muted small ms-2">${ok} of ${items.length} connected</span>`;
    }
    return `
      <div class="mb-4">
        <div class="d-flex align-items-center mb-2">
          <span class="text-uppercase fw-semibold small text-secondary" style="letter-spacing:.05em">${title}</span>
          ${summary}
        </div>
        <div class="row g-3">${items.map(cardHtml).join('')}</div>
      </div>`;
  }).join('');
}

function skeletonCards() {
  return renderGroups(({ label }) => `
    <div class="col-12 col-md-6 col-xl-4">
      <div class="card h-100">
        <div class="card-body">
          <div class="d-flex align-items-center gap-2 mb-2">
            <span class="status-dot status-loading"></span>
            <span class="fw-semibold">${label}</span>
          </div>
          <small class="text-muted">Checking…</small>
        </div>
      </div>
    </div>`);
}

function renderCards(data) {
  return renderGroups(({ key, label, urlKey }) => {
    const info  = data[key] || { status: 'unknown' };
    const { status, latency_ms, error } = info;
    const addr  = urlKey ? (info[urlKey] || '') : '';
    const dotCls = `status-dot status-${status}`;

    let detail;
    if (status === 'ok')
      detail = `<span class="text-success small"><i class="bi bi-check-circle me-1"></i>${latency_ms != null ? latency_ms + ' ms' : 'OK'}</span>`;
    else if (status === 'not_configured')
      detail = `<span class="text-muted small" title="${error || ''}">${(error || 'Not configured').substring(0, 55)}</span>`;
    else
      detail = `<span class="text-danger small" title="${error || ''}">${(error || 'unreachable').substring(0, 55)}</span>`;

    return `
      <div class="col-12 col-md-6 col-xl-4">
        <div class="card h-100">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <div class="flex-grow-1">
                <div class="d-flex align-items-center gap-2 mb-1">
                  <span class="${dotCls}"></span>
                  <span class="fw-semibold">${label}</span>
                  ${info.active ? '<span class="badge rounded-pill text-bg-success" style="font-size:.65rem">active</span>' : ''}
                </div>
                ${addr ? `<div class="text-muted font-monospace small mb-1">${addr}</div>` : ''}
                ${detail}
              </div>
            </div>
          </div>
        </div>
      </div>`;
  }, data);
}

async function loadHealth() {
  const container = document.getElementById('integration-cards');
  container.innerHTML = skeletonCards();
  try {
    const data = await apiFetch('/health/integrations');
    container.innerHTML = renderCards(data);
  } catch (e) {
    container.innerHTML = `
      <div class="col-12">
        <div class="alert alert-danger">Failed to fetch integration status: ${e.message}</div>
      </div>`;
  }
}

loadHealth();
</script>
{% endblock %}
