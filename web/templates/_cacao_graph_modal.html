<!-- ── Workflow graph modal ── -->
<div class="modal fade" id="graphModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header py-2">
        <div>
          <h6 class="modal-title mb-0" id="graph-title"></h6>
          <code class="text-muted" style="font-size:.68rem" id="graph-id"></code>
        </div>
        <div class="ms-auto d-flex align-items-center gap-2">
          <span class="small text-muted d-none" id="graph-edit-note"></span>
          <!-- Shown only when the page passed a save handler (see CacaoGraph.openModal) -->
          <button type="button" class="btn btn-sm btn-outline-primary d-none" id="graph-edit-btn"
                  onclick="CacaoGraph.startEdit()"><i class="bi bi-pencil me-1"></i>Edit</button>
          <button type="button" class="btn btn-sm btn-outline-secondary d-none" id="graph-discard-btn"
                  onclick="CacaoGraph.discardEdit()">Discard</button>
          <button type="button" class="btn btn-sm btn-primary d-none" id="graph-save-btn"
                  onclick="CacaoGraph.saveEdit()"><i class="bi bi-check-lg me-1"></i>Save</button>
          <button type="button" class="btn-close ms-1" data-bs-dismiss="modal"></button>
        </div>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <!-- Graph and step detail are the same box: equal width, equal height.
               The graph scales to fit its box; the detail scrolls when it is long. -->
          <div class="col-12 col-lg-6">
            <div class="border rounded p-2" id="graph-canvas"
                 style="background:#f6f8fa;height:62vh;overflow:hidden"></div>
          </div>
          <div class="col-12 col-lg-6">
            <div class="border rounded p-3" id="graph-detail"
                 style="height:62vh;overflow:auto"></div>
          </div>
        </div>

        <!-- Playbook-level metadata -->
        <div class="mt-3 pt-3 border-top">
          <div class="row g-3" id="graph-meta" style="font-size:.78rem"></div>
        </div>
      </div>
    </div>
  </div>
</div>
