services:
  ai4soar:
    build: .
    image: ai4soar:latest
    container_name: ai4soar
    # Host networking: MongoDB (127.0.0.1:27017), Ollama, NATS, Kafka and the
    # Shuffle backend (localhost:5001) are reached exactly as when running
    # `python3 server.py` on the host. The listen address comes from
    # SERVER_HOST in .env — set it to 127.0.0.1 behind Apache.
    network_mode: host
    env_file: .env
    volumes:
      - ./output:/app/output
      # Templates edited in the UI (Workflow → Edit) are saved here, in the repository
      - ./playbooks:/app/playbooks
    restart: unless-stopped

  # Broker for the live alerts page (/api/nats_stream); localhost only
  nats:
    image: nats:2.10-alpine
    container_name: ai4soar-nats
    ports:
      - "127.0.0.1:4222:4222"
    restart: unless-stopped

  # Single-node Kafka for the Kafka tab of the Alerts page; localhost only.
  # Point KAFKA_BROKERS in .env elsewhere to use an external broker instead.
  kafka:
    image: apache/kafka-native:3.8.0
    container_name: ai4soar-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

volumes:
  kafka-data:
